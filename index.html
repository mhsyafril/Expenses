<title>Buku Kas</title>
<link rel="manifest" href='data:application/json,{"name":"Buku Kas","short_name":"BukuKas","start_url":".","display":"standalone","background_color":"%23F3EFE3","theme_color":"%231F5C56","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27192%27 height=%27192%27%3E%3Crect width=%27192%27 height=%27192%27 rx=%2742%27 fill=%27%231F5C56%27/%3E%3Ctext x=%2796%27 y=%27128%27 font-size=%2790%27 font-family=%27Georgia%27 fill=%27%23F3EFE3%27 text-anchor=%27middle%27%3ERp%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2EEE1;--card:#FBF8EF;--card2:#F4EFE0;--line:#E2DBC4;--line2:#CFC6A8;
    --ink:#22251F;--muted:#7C7762;--faint:#A39C84;
    --teal:#1F5C56;--teal-d:#143E39;--clay:#B5613A;--gold:#C7913B;--violet:#7C5BAE;--blue:#3F7DB0;
    --in:#2E7D5B;--out:#B5613A;--neg:#BC4B3C;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;overscroll-behavior:none}
  body{padding:0 0 calc(72px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto;padding:0 15px}
  .mono{font-family:'Spline Sans Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .dsp{font-family:'Bricolage Grotesque',sans-serif}
  .lbl{font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

  header{padding:18px 0 4px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:9px}
  .mk{width:30px;height:30px;border-radius:9px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:13px}
  .brand h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:19px;letter-spacing:-.3px}
  .pill{font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:.08em;color:var(--faint);padding:5px 9px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
  .pill.on{color:var(--in);border-color:rgba(46,125,91,.4)}

  .hero{background:linear-gradient(155deg,var(--teal),var(--teal-d));color:#F2EEE1;border-radius:20px;padding:18px;margin-top:8px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.05)}
  .hero .lbl{color:rgba(242,238,225,.55)}
  .nw{font-family:'Spline Sans Mono';font-weight:600;font-size:31px;margin:5px 0 1px;letter-spacing:-.5px}
  .nw-sub{font-size:12px;color:rgba(242,238,225,.72);font-family:'Spline Sans Mono'}
  .spark{margin-top:10px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}
  .card .k{font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .card .v{font-family:'Spline Sans Mono';font-weight:600;font-size:19px;margin-top:6px}
  .card .s{font-size:11px;color:var(--faint);margin-top:3px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:14px;overflow:hidden}
  .ph{padding:13px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .ph h2{font-family:'Bricolage Grotesque';font-weight:800;font-size:15px}
  .ph .lbl{font-size:9px}

  .monthbar{display:flex;align-items:center;gap:8px;margin-top:14px}
  .mbtn{flex:0 0 auto;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:17px;color:var(--ink)}
  .mname{flex:1;text-align:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px}
  .madd{flex:0 0 auto;height:40px;padding:0 12px;border-radius:11px;border:1px dashed var(--line2);background:transparent;color:var(--muted);font-family:'Spline Sans Mono';font-size:10.5px}

  .sum-top{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 15px 10px}
  .sum-top .bal{font-family:'Spline Sans Mono';font-weight:600;font-size:23px}
  .io{display:flex;gap:13px;font-family:'Spline Sans Mono';font-size:12px}
  .io .i{color:var(--in)} .io .o{color:var(--out)}

  .tx{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line)}
  .tx:last-child{border-bottom:none}
  .tx .dt{font-family:'Spline Sans Mono';font-size:10.5px;color:var(--faint);width:32px;text-align:center;line-height:1.2}
  .tx .dt b{display:block;font-size:14px;color:var(--muted);font-weight:600}
  .tx .mid{flex:1;min-width:0}
  .tx .ds{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx .tg{display:inline-block;margin-top:3px;font-size:9.5px;letter-spacing:.05em;font-family:'Spline Sans Mono';color:var(--muted);background:var(--card2);padding:2px 7px;border-radius:5px}
  .tx .rt{text-align:right;font-family:'Spline Sans Mono';white-space:nowrap}
  .tx .rt .a{font-size:14.5px;font-weight:600}
  .tx .rt .b{font-size:10px;color:var(--faint);margin-top:2px}
  .amt-in{color:var(--in)} .amt-out{color:var(--out)}
  .empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.65}

  .legend{display:flex;flex-wrap:wrap;gap:9px 14px;padding:12px 16px 16px}
  .lg{display:flex;align-items:center;gap:7px;font-size:12px}
  .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  .lg .vv{font-family:'Spline Sans Mono';color:var(--muted);font-size:11px;margin-left:auto}

  .hold{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .hold:last-of-type{border-bottom:none}
  .hold .hm{flex:1;min-width:0}
  .hold .hm .t{font-weight:600;font-size:14.5px}
  .hold .hm .s{font-family:'Spline Sans Mono';font-size:10.5px;color:var(--muted);margin-top:3px}
  .hold .hv{text-align:right;font-family:'Spline Sans Mono'}
  .hold .hv .a{font-weight:600;font-size:14.5px}
  .hold .hv .g{font-size:11px;margin-top:2px}
  .gp{color:var(--in)} .gn{color:var(--neg)}

  .row{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line)}
  .row:last-of-type{border-bottom:none}
  .row input{padding:9px 10px;font-size:14px;width:100%}
  .row .f1{flex:1}.row .vv{width:118px;text-align:right;font-family:'Spline Sans Mono'}
  .row .ap{width:66px;font-size:11px;font-family:'Spline Sans Mono';text-align:center;color:var(--muted)}
  .row .rm{background:none;border:none;color:var(--faint);font-size:17px;width:auto;padding:2px}
  .tot{display:flex;justify-content:space-between;padding:12px 15px;font-family:'Spline Sans Mono';font-weight:600;font-size:13.5px;background:var(--card2)}
  .addmini{width:100%;padding:11px;border:none;border-top:1px dashed var(--line2);background:transparent;color:var(--muted);font-family:'Spline Sans Mono';font-size:11px}

  input,select{background:var(--card);border:1px solid var(--line2);color:var(--ink);padding:12px;border-radius:11px;font-size:16px;font-family:'Figtree';width:100%}
  input:focus,select:focus{outline:none;border-color:var(--teal)}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(251,248,239,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
  .nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;color:var(--faint);font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:.06em}
  .nav button.act{color:var(--teal)}
  .nav .ic{font-size:18px;line-height:1}
  .fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:41;width:56px;height:56px;border-radius:18px;background:var(--teal);color:#fff;border:none;font-size:26px;box-shadow:0 8px 20px rgba(31,92,86,.4);display:flex;align-items:center;justify-content:center}
  .fab:active{transform:scale(.94)}

  .ov{position:fixed;inset:0;background:rgba(20,22,18,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .25s cubic-bezier(.2,.7,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .grip{width:38px;height:4px;background:var(--line2);border-radius:3px;margin:0 auto 15px}
  .seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;padding:11px;border:none;background:transparent;border-radius:9px;font-family:'Figtree';font-weight:600;font-size:14px;color:var(--muted)}
  .seg button.act{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .seg button.act.outc{color:var(--out)}.seg button.act.inc{color:var(--in)}
  .field{margin-bottom:13px}
  .field label{display:block;font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .big{font-family:'Spline Sans Mono';font-weight:600;font-size:24px;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:9px 13px;border:1px solid var(--line2);background:var(--card);border-radius:20px;font-size:13px;color:var(--ink)}
  .chip.act{background:var(--teal);color:#fff;border-color:var(--teal)}
  .chip.q{border-style:dashed;color:var(--muted);font-family:'Spline Sans Mono';font-size:11px}
  .acts{display:flex;gap:9px;margin-top:4px}
  .acts button{flex:1;padding:14px;border-radius:12px;font-family:'Bricolage Grotesque';font-weight:800;font-size:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink)}
  .acts .save{background:var(--teal);color:#fff;border-color:var(--teal)}
  .acts .del{flex:0 0 auto;background:transparent;border-color:var(--neg);color:var(--neg)}

  .install{background:var(--card);border:1px dashed var(--line2);border-radius:14px;padding:13px 14px;margin-top:13px;font-size:12.5px;color:var(--muted);line-height:1.55;display:flex;gap:10px;align-items:flex-start}
  .install b{color:var(--ink)} .install .x{margin-left:auto;background:none;border:none;color:var(--faint);font-size:17px;width:auto;padding:0 2px}
  .gauge-wrap{padding:16px}
  .frow{display:flex;gap:9px;margin-top:14px}
  .fb{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:11px;font-family:'Figtree';font-weight:600;font-size:12.5px;color:var(--ink)}
  details{margin-top:8px}summary{list-style:none;color:var(--muted);font-family:'Spline Sans Mono';font-size:10.5px;letter-spacing:.1em;padding:8px;text-align:center}summary::-webkit-details-marker{display:none}
  .note{font-size:10.5px;color:var(--faint);line-height:1.6;margin:14px 0 4px;padding:0 4px;text-align:center}
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);background:var(--ink);color:#F2EEE1;padding:10px 18px;border-radius:24px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{padding:90px 20px;text-align:center;color:var(--muted);font-family:'Spline Sans Mono';font-size:13px;letter-spacing:.1em}
  svg{display:block}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading Buku Kas…</div></div>
<button class="fab" id="fab" onclick="openTx()" style="display:none">＋</button>
<nav class="nav" id="nav" style="display:none"></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== storage: window.storage inside Claude, localStorage on a real phone ===== */
const KEY="buku-kas-app-v1";
const STORE=(()=>{
  if(typeof window!=="undefined"&&window.storage&&typeof window.storage.get==="function")
    return {get:async k=>{try{const r=await window.storage.get(k,false);return r&&r.value?r.value:null}catch(e){return null}},
            set:async (k,v)=>{try{await window.storage.set(k,v,false)}catch(e){}}};
  return {get:async k=>{try{return localStorage.getItem(k)}catch(e){return null}},
          set:async (k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
})();

const OUT_CATS=["Groceries","Eating-Out","Shopping","Utilities","Saham","Other"];
const IN_CATS=["Income","Saham","Other"];
const COL={"Groceries":"#1F5C56","Eating-Out":"#B5613A","Shopping":"#7C5BAE","Utilities":"#C7913B","Saham":"#3F7DB0","Other":"#8A8569","Income":"#2E7D5B"};
const QUICK=[
  {l:"Tsuruha",d:"Tsuruha",c:"Groceries",dir:"out"},{l:"Morinaga",d:"Morinaga",c:"Groceries",dir:"out"},
  {l:"Onigiri",d:"Onigiri",c:"Eating-Out",dir:"out"},{l:"Apartemen",d:"Apartemen",c:"Utilities",dir:"out",a:26000},
  {l:"Gas",d:"Gas",c:"Utilities",dir:"out",a:5000},{l:"Air",d:"Air",c:"Utilities",dir:"out"},
  {l:"Listrik",d:"Listrik",c:"Utilities",dir:"out"},{l:"iPhone",d:"iPhone",c:"Utilities",dir:"out",a:5272},
  {l:"Data",d:"Data Internet",c:"Utilities",dir:"out",a:1000},{l:"Asuransi",d:"Asuransi kesehatan",c:"Utilities",dir:"out",a:2500},
  {l:"Mext ↓",d:"Mext",c:"Income",dir:"in",a:145000},{l:"Baito ↓",d:"Baito",c:"Income",dir:"in"},
];
const MK=(y,m)=>y+"-"+String(m).padStart(2,"0");
const u=()=>Math.random().toString(36).slice(2,9);

function DEFAULTS(){
  const fixed=m=>[
    {id:u(),date:m+"-01",desc:"Mext (scholarship)",amt:145000,dir:"in",cat:"Income"},
    {id:u(),date:m+"-05",desc:"Apartemen",amt:26000,dir:"out",cat:"Utilities"},
    {id:u(),date:m+"-05",desc:"Asuransi kesehatan",amt:2500,dir:"out",cat:"Utilities"},
    {id:u(),date:m+"-08",desc:"Gas",amt:5000,dir:"out",cat:"Utilities"},
    {id:u(),date:m+"-08",desc:"Listrik",amt:3000,dir:"out",cat:"Utilities"},
    {id:u(),date:m+"-08",desc:"Air",amt:4950,dir:"out",cat:"Utilities"},
    {id:u(),date:m+"-10",desc:"iPhone + Data",amt:6272,dir:"out",cat:"Utilities"},
  ];
  return {
    kurs:106.71, cur:MK(2026,5), tab:"home", showInstall:true,
    months:{ "2026-05":{start:11027,tx:[
      ...fixed("2026-05"),
      {id:u(),date:"2026-05-15",desc:"Baito (part-time)",amt:50000,dir:"in",cat:"Income"},
      {id:u(),date:"2026-05-20",desc:"Bayar JCB (credit card)",amt:43895,dir:"out",cat:"Other"},
    ]} },
    accounts:[
      {id:u(),name:"Yuchou",app:"JP bank",ccy:"JPY",amount:11027},
      {id:u(),name:"BNI",app:"ID bank",ccy:"IDR",amount:450000},
      {id:u(),name:"Dompet",app:"Cash",ccy:"JPY",amount:0},
      {id:u(),name:"Paypay",app:"Paypay",ccy:"JPY",amount:0},
      {id:u(),name:"JCB",app:"Credit card",ccy:"JPY",amount:-43895},
    ],
    holdings:[
      {id:u(),broker:"IPOT",ticker:"BRMS",lots:723,avg:900,last:900},
      {id:u(),broker:"IPOT",ticker:"CGAS",lots:2994,avg:176,last:176},
      {id:u(),broker:"Stockbit",ticker:"BRMS",lots:396,avg:900,last:900},
    ],
    goalEmergency:300000,
    snapshots:[],
    updated:null
  };
}
let S=DEFAULTS(), editId=null, txDir="out", txCat="Groceries";

const nf=n=>Math.round(n).toLocaleString("en-US");
const k1=n=>{n=Math.round(n);return Math.abs(n)>=1e6?(n/1e6).toFixed(2)+"M":Math.abs(n)>=1000?(n/1000).toFixed(0)+"k":""+n;};
const yen=n=>"¥"+nf(n);
const rp=n=>"Rp"+nf(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const monthLabel=k=>{const[y,m]=k.split("-");return new Date(y,m-1,1).toLocaleString("en-US",{month:"long"})+" "+y;};
const monthShort=k=>{const[y,m]=k.split("-");return new Date(y,m-1,1).toLocaleString("en-US",{month:"short"});};
const daysIn=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate();};
function elapsed(k){const n=new Date(),c=MK(n.getFullYear(),n.getMonth()+1);return k===c?n.getDate():(k>c?1:daysIn(k));}
function MO(k){k=k||S.cur;if(!S.months[k])S.months[k]={start:0,tx:[]};return S.months[k];}
function ord(k){return MO(k).tx.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}
function calc(k){const m=MO(k);let bal=m.start||0,inT=0,outT=0;const cats={};
  ord(k).forEach(t=>{if(t.dir==="in"){bal+=t.amt;inT+=t.amt;}else{bal-=t.amt;outT+=t.amt;cats[t.cat]=(cats[t.cat]||0)+t.amt;}t._bal=bal;});
  return {bal,inT,outT,cats};}
const toJ=(a,c)=>c==="JPY"?a:a/(S.kurs||1);
function holdVal(h){return (Number(h.lots)||0)*100*(Number(h.last)||0);} // IDR
function holdJ(h){return holdVal(h)/(S.kurs||1);}
function nw(){
  let cash=0,debt=0;
  S.accounts.forEach(a=>{const j=toJ(Number(a.amount)||0,a.ccy);if(j<0)debt+=-j;else cash+=j;});
  const stocks=S.holdings.reduce((s,h)=>s+holdJ(h),0);
  return {cash,debt,stocks,assets:cash+stocks,net:cash+stocks-debt};
}

let saveT;
function persist(){
  S.updated=new Date().toISOString();
  const p=document.getElementById("savePill");if(p){p.textContent="saving…";p.classList.remove("on");}
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{await STORE.set(KEY,JSON.stringify(S));if(p){p.textContent="saved";p.classList.add("on");}},400);
}
async function load(){const v=await STORE.get(KEY);if(v){try{S=Object.assign(DEFAULTS(),JSON.parse(v));}catch(e){}}}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._h);e._h=setTimeout(()=>e.classList.remove("show"),1900);}

/* ===== SVG charts ===== */
function donut(items,size){ // items:[{label,val,color}]
  const tot=items.reduce((s,i)=>s+i.val,0)||1, R=size/2, r=R*0.62, cx=R, cy=R; let a=-Math.PI/2, segs="";
  items.forEach(it=>{ const frac=it.val/tot, a2=a+frac*2*Math.PI;
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    const xi2=cx+r*Math.cos(a2),yi2=cy+r*Math.sin(a2),xi1=cx+r*Math.cos(a),yi1=cy+r*Math.sin(a);
    const big=frac>0.5?1:0;
    segs+=`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 ${big} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${xi2.toFixed(2)} ${yi2.toFixed(2)} A${r} ${r} 0 ${big} 0 ${xi1.toFixed(2)} ${yi1.toFixed(2)} Z" fill="${it.color}"/>`;
    a=a2; });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${segs}</svg>`;
}
function areaChart(vals,W,H){
  if(vals.length<2)return `<div class="empty" style="padding:18px">Need 2+ months of history.<br>Tap “Snapshot now” to start the trend.</div>`;
  const P=6,mn=Math.min(...vals),mx=Math.max(...vals),sp=(mx-mn)||1;
  const pts=vals.map((v,i)=>[P+i*(W-2*P)/(vals.length-1),P+(H-2*P)*(1-(v-mn)/sp)]);
  const ln=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const ar=ln+` L${pts[pts.length-1][0].toFixed(1)} ${H-P} L${pts[0][0].toFixed(1)} ${H-P} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F5C56" stop-opacity=".28"/><stop offset="1" stop-color="#1F5C56" stop-opacity="0"/></linearGradient></defs>
    <path d="${ar}" fill="url(#ag)"/><path d="${ln}" fill="none" stroke="#1F5C56" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?3.6:2.2}" fill="${i===pts.length-1?'#B5613A':'#FBF8EF'}" stroke="#1F5C56" stroke-width="1.4"/>`).join("")}
  </svg>`;
}
function barsIO(keys,W,H){
  const P=18,mx=Math.max(1,...keys.map(k=>{const c=calc(k);return Math.max(c.inT,c.outT);}));
  const gw=(W-2*P)/keys.length, bw=Math.min(15,gw*0.32);
  let b="";
  keys.forEach((k,i)=>{const c=calc(k);const x=P+i*gw+gw/2;
    const hi=(c.inT/mx)*(H-26),ho=(c.outT/mx)*(H-26);
    b+=`<rect x="${(x-bw-1).toFixed(1)}" y="${(H-22-hi).toFixed(1)}" width="${bw}" height="${hi.toFixed(1)}" rx="3" fill="#2E7D5B"/>`;
    b+=`<rect x="${(x+1).toFixed(1)}" y="${(H-22-ho).toFixed(1)}" width="${bw}" height="${ho.toFixed(1)}" rx="3" fill="#B5613A"/>`;
    b+=`<text x="${x.toFixed(1)}" y="${H-7}" font-size="10" fill="#A39C84" text-anchor="middle" font-family="Spline Sans Mono">${monthShort(k)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${b}</svg>`;
}
function gauge(pct){
  const W=200,H=110,cx=100,cy=100,R=80,a0=Math.PI,a1=Math.PI*(1-pct/100);
  const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
  const xe=cx+R*Math.cos(0),ye=cy+R*Math.sin(0);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
    <path d="M${x0} ${y0} A${R} ${R} 0 0 1 ${xe} ${ye}" fill="none" stroke="#E2DBC4" stroke-width="14" stroke-linecap="round"/>
    <path d="M${x0} ${y0} A${R} ${R} 0 ${pct>50?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${pct>85?'#BC4B3C':pct>60?'#C7913B':'#2E7D5B'}" stroke-width="14" stroke-linecap="round"/>
    <text x="100" y="86" font-size="26" font-weight="600" fill="#22251F" text-anchor="middle" font-family="Spline Sans Mono">${pct.toFixed(0)}%</text>
  </svg>`;
}

function drawTx(t){

  document.getElementById("sheet").innerHTML=`<div class="grip"></div>
  <div class="seg"><button class="${txDir==='out'?'act outc':''}" onclick="setDir('out')">▼ Keluar</button><button class="${txDir==='in'?'act inc':''}" onclick="setDir('in')">▲ Masuk</button></div>
  <div class="field"><label>Jumlah ¥</label><input id="amt" class="big" type="number" inputmode="numeric" placeholder="0" value="${t?t.amt:''}"></div>
  ${!t?`<div class="field"><label>Quick add</label><div class="chips">${QUICK.filter(q=>q.dir===txDir).map((q,i)=>`<button class="chip q" onclick="quick(${i})">${q.l}</button>`).join("")}</div></div>`:""}
  <div class="field"><label>Keterangan</label><input id="desc" placeholder="e.g. Tsuruha" value="${t?esc(t.desc):''}"></div>
  <div class="field"><label>Kategori</label><div class="chips" id="cc">${cats.map(k=>`<button class="chip ${txCat===k?'act':''}" onclick="setCat('${k}')">${k}</button>`).join("")}</div></div>
  <div class="field"><label>Tanggal</label><input id="date" type="date" value="${t?t.date:new Date().toISOString().slice(0,10)}"></div>
  <div class="acts">${t?`<button class="del" onclick="delTx('${t.id}')">Hapus</button>`:""}<button onclick="closeOv()">Batal</button><button class="save" onclick="saveTx()">Simpan</button></div>`;
}
function setDir(d){txDir=d;if((d==="out"?OUT_CATS:IN_CATS).indexOf(txCat)<0)txCat=d==="out"?"Groceries":"Income";
  const t=editId?MO().tx.find(x=>x.id===editId):null;const a=val("amt"),ds=val("desc"),dt=val("date");
  drawTx(t?Object.assign({},t,{amt:a,desc:ds,date:dt}):null);if(!t){if(a)el("amt").value=a;if(ds)el("desc").value=ds;}}
function setCat(k){txCat=k;[...document.querySelectorAll("#cc .chip")].forEach(b=>b.classList.toggle("act",b.textContent===k));}
function quick(i){const q=QUICK.filter(x=>x.dir===txDir)[i];el("desc").value=q.d;setCat(q.c);if(q.a)el("amt").value=q.a;else el("amt").focus();}
function saveTx(){const amt=parseFloat(val("amt"));if(!amt||amt<=0){toast("Masukkan jumlah");return;}
  const desc=val("desc").trim(),date=val("date")||new Date().toISOString().slice(0,10);
  if(editId){const t=MO().tx.find(x=>x.id===editId);Object.assign(t,{amt,desc,date,dir:txDir,cat:txCat});}
  else MO().tx.push({id:u(),amt,desc,date,dir:txDir,cat:txCat});
  persist();closeOv();render();toast(editId?"Diperbarui":"Tersimpan ✓");}
function delTx(id){if(!confirm("Hapus transaksi ini?"))return;MO().tx=MO().tx.filter(x=>x.id!==id);persist();closeOv();render();}

function upAcc(id,k,v){const a=S.accounts.find(x=>x.id===id);if(!a)return;a[k]=k==="amount"?(parseFloat(v)||0):v;persist();if(k==="amount"||k==="ccy")render();}
function addAcc(){S.accounts.push({id:u(),name:"New",app:"",ccy:"JPY",amount:0});persist();render();}
function rmAcc(id){if(!confirm("Hapus akun ini?"))return;S.accounts=S.accounts.filter(x=>x.id!==id);persist();render();}
function snapNow(){const n=nw();const mth=new Date().toISOString().slice(0,7);const r={month:mth,net:Math.round(n.net),stocks:Math.round(n.stocks),cash:Math.round(n.cash),debt:Math.round(n.debt)};
  const i=S.snapshots.findIndex(s=>s.month===mth);if(i>=0)S.snapshots[i]=r;else S.snapshots.push(r);persist();render();toast("Snapshot "+mth+" ✓");}
function exportCSV(){const L=["BUKU KAS,"+new Date().toLocaleString(),"","KEKAYAAN,Name,Ccy,Amount,JPY"];
  S.accounts.forEach(a=>L.push([",",a.name,a.ccy,a.amount,Math.round(toJ(a.amount,a.ccy))].join(",")));
  L.push("","HOLDINGS,Broker,Ticker,Lots,Last(Rp),Value(Rp),Value(JPY)");
  S.holdings.forEach(h=>L.push([",",h.broker,h.ticker,h.lots,h.last,Math.round(holdVal(h)),Math.round(holdJ(h))].join(",")));
  const sv=S.cur;Object.keys(S.months).sort().forEach(k=>{S.cur=k;const c=calc(k);L.push("","MONTH,"+k,"Start,"+(MO(k).start||0),"No,Date,Desc,In,Out,Bal,Cat");
    let i=1;ord(k).forEach(t=>L.push([i++,t.date,'"'+(t.desc||"")+'"',t.dir==="in"?t.amt:"",t.dir==="out"?t.amt:"",Math.round(t._bal||0),t.cat].join(",")));
    L.push("Totals,In,"+c.inT+",Out,"+c.outT+",End,"+Math.round(c.bal));});S.cur=sv;
  dl("buku-kas.csv","text/csv",L.join("\n"));}
function exportJSON(){dl("buku-kas-backup.json","application/json",JSON.stringify(S,null,2));}
function dl(n,t,d){const b=new Blob([d],{type:t}),url=URL.createObjectURL(b),a=document.createElement("a");a.href=url;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(url),800);toast("Downloaded "+n);}
function resetAll(){if(!confirm("Erase everything and restore your seeded situation?"))return;S=DEFAULTS();persist();render();toast("Reset");}

(async function(){await load();render();const p=el("savePill");if(p){p.textContent="saved";p.classList.add("on");}})();
</script>
