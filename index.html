<script>
/* ===== E2E Encryption & Storage Backend ===== */
const KEY="buku-kas-app-v1";
const API_URL = "https://script.google.com/macros/s/AKfycbxcUFUFCfkZXwaXkMwwz8ZoBFZ-1mbm4i_2uPwOtbTv6O8AiqRWjuKUnA2_jIuFJYwT/exec";

// Local state for E2EE
let currentPin = localStorage.getItem("app_key") || "";
let inputPin = "";
let rawCipher = null;
let isNewUser = false;
let isUnencryptedMigration = false;

const STORE = {
  get: async (k) => {
    try {
      const res = await fetch(API_URL);
      const text = await res.text();
      return text && text.length > 2 ? text : null;
    } catch(e) {
      return localStorage.getItem(k);
    }
  },
  set: async (k, v) => {
    try {
      await fetch(API_URL, { method: "POST", body: v, headers: { "Content-Type": "text/plain" }});
      localStorage.setItem(k, v);
    } catch(e) {
      localStorage.setItem(k, v);
    }
  }
};

// PIN Input Logic
function addPin(n) {
  if (inputPin.length < 6) inputPin += n;
  updatePinDisplay();
  if (inputPin.length === 6) setTimeout(checkPin, 150);
}
function delPin() {
  inputPin = inputPin.slice(0, -1);
  updatePinDisplay();
  if (isNewUser) document.getElementById("pinMsg").textContent = "PIN ini tidak bisa di-reset. Jangan sampai lupa!";
  else document.getElementById("pinMsg").textContent = "";
}
function updatePinDisplay() {
  document.getElementById("pinDisplay").textContent = "•".repeat(inputPin.length);
}

function tryDecrypt(pinStr) {
   try {
      const bytes = CryptoJS.AES.decrypt(rawCipher, pinStr);
      const txt = bytes.toString(CryptoJS.enc.Utf8);
      if(!txt) return false;
      const parsed = JSON.parse(txt);
      if (parsed && parsed.months) { 
         S = parsed;
         S.viewCcy = S.viewCcy || "JPY";
         return true;
      }
   } catch(e) {}
   return false;
}

function checkPin() {
  if (isNewUser) {
    currentPin = inputPin;
    localStorage.setItem("app_key", currentPin);
    
    if (!isUnencryptedMigration) {
       S = DEFAULTS();
    }
    
    // First persist will encrypt using the newly set currentPin
    persist(); 
    startApp();
  } else {
    if (tryDecrypt(inputPin)) {
      currentPin = inputPin;
      localStorage.setItem("app_key", currentPin);
      startApp();
    } else {
      document.getElementById("pinMsg").textContent = "PIN Salah! Gagal mendekripsi data.";
      inputPin = "";
      updatePinDisplay();
      const scr = document.getElementById("pinScreen");
      scr.style.transform = "translateX(10px)";
      setTimeout(() => scr.style.transform = "translateX(-10px)", 50);
      setTimeout(() => scr.style.transform = "translateX(0)", 100);
    }
  }
}

function MO(k){k=k||S.cur;if(!S.months[k])S.months[k]={start:0,tx:[]};return S.months[k];}
function ord(k){return MO(k).tx.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}
function calc(k){const m=MO(k);let bal=m.start||0,inT=0,outT=0;const cats={};
  ord(k).forEach(t=>{
    if(t.dir==="in"){bal+=t.amt;inT+=t.amt;}

    t._bal=bal;
  });
  return {bal,inT,outT,cats};}

const USE_APPS_SCRIPT_PROXY = true; 
const PROXIES = [
  (url)=>`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}&_=${Date.now()}`,
  (url)=>`https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  (url)=>`https://thingproxy.freeboard.io/fetch/${url}`,
];

async function tryAppsScriptProxy(targetUrl){
  if(!USE_APPS_SCRIPT_PROXY || !API_URL) return null;
  try{
    const u = API_URL + (API_URL.includes("?")?"&":"?") + "proxy=" + encodeURIComponent(targetUrl) + "&_=" + Date.now();
    const res = await fetch(u, {cache:"no-store"});
    if(!res.ok) return null;
    const txt = await res.text();
    if(txt && txt.length > 5 && txt.indexOf("buku-kas")===-1 && txt.indexOf('"holdings"')===-1) return txt;
  }catch(e){}
  return null;
}

async function tryFetchText(targetUrl){
  const viaScript = await tryAppsScriptProxy(targetUrl);
  if(viaScript) return viaScript;
  for(const mk of PROXIES){
    try{
      const res = await fetch(mk(targetUrl), {cache:"no-store"});
      if(!res.ok) continue;
      const txt = await res.text();
      if(txt && txt.length > 5) return txt;
    }catch(e){}
  }
  return null;
}

async function fetchYahoo(ticker){
  const t = ticker.toUpperCase().replace('.JK','').trim() + '.JK';
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${t}?interval=1d&range=1d`;
  const txt = await tryFetchText(url);
  if(!txt) return null;
  try{
    const j = JSON.parse(txt);
    const r = j && j.chart && j.chart.result && j.chart.result[0];
    const p = r && r.meta && (r.meta.regularMarketPrice || r.meta.previousClose);
    if(p && !isNaN(p) && p > 0) return parseFloat(p);
  }catch(e){}
  return null;
}

async function fetchStooq(ticker){
  const sym = ticker.toLowerCase().replace('.jk','') + '.jk';
  const url = `https://stooq.com/q/l/?s=${sym}&f=sd2t2ohlcv&h&e=csv`;
  const txt = await tryFetchText(url);
  if(!txt) return null;
  const lines = txt.trim().split(/\r?\n/);
  if(lines.length < 2) return null;
  const cells = lines[1].split(',');
  const close = parseFloat(cells[6]);
  if(close && !isNaN(close) && close > 0) return close;
  return null;
}

async function fetchGoogle(ticker){
  const t = ticker.toUpperCase().replace('.JK','').trim();
  const gf = t.length === 4 ? t + ":IDX" : t;
  const url = `https://www.google.com/finance/quote/${gf}`;
  const html = await tryFetchText(url);
  if(!html) return null;
  let m = html.match(/data-last-price="([0-9.]+)"/);
  if(!m) m = html.match(/class="YMlKec fxKbKc"[^>]*>([^<]+)</);
  if(!m) return null;
  let pStr = String(m[1]).replace(/[^0-9.,]/g,'');
  if(pStr.indexOf(',') > pStr.indexOf('.')) pStr = pStr.replace(/\./g,'').replace(',', '.');
  else pStr = pStr.replace(/,/g,'');
  const price = parseFloat(pStr);
  return (price && !isNaN(price) && price > 0) ? price : null;
}

let SYNCING=false;
async function fetchMarketData(silent=false){
  if(SYNCING){ if(!silent) toast("Sinkronisasi sedang berjalan…"); return; }
  SYNCING = true;
  if(!silent) toast("🔄 Mengambil harga pasar…");

  let kursOld = S.kurs, kursNew = null, upS = [], failS = [], src = "scrape";

  const sheet = await fetchSheetPrices();
  const handled = {};
  if(sheet){
    src = "sheet";
    if(sheet.kurs && sheet.kurs > 0){ kursNew = sheet.kurs; if(sheet.kurs !== S.kurs) S.kurs = sheet.kurs; }
    S.holdings.forEach(h=>{
      const key = String(h.ticker||'').toUpperCase().replace('.JK','').trim();
      const p = sheet.prices ? sheet.prices[key] : null;
      if(p && p > 0){
        if(h.last !== p) h.last = p;
        upS.push(`${h.ticker}→${nf(p)} (GF)`);
        handled[h.id] = true;
      }
    });
  }

  if(kursNew === null){
    const nk = await fetchKurs();
    if(nk && nk > 0){ kursNew = nk; if(nk !== S.kurs) S.kurs = nk; }
  }

  for(const h of S.holdings){
    if(handled[h.id]) continue;
    try{
      const r = await fetchOnePrice(h);
      if(r && r.price){
        if(h.last !== r.price) h.last = r.price;
        upS.push(`${h.ticker}→${nf(r.price)} (${r.src})`);
      }else{
        failS.push(h.ticker);
      }
    }catch(e){ failS.push(h.ticker); }
  }

  const stamp = new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
  S.priceLog = {
    at: stamp,
    kurs: kursNew ? `${kursOld}→${kursNew}` : `${kursOld} (tidak berubah)`,
    ok: upS, fail: failS,
    via: src === "sheet" ? "Google Sheet (GOOGLEFINANCE)" : "scrape fallback"
  };

  if(upS.length || kursNew){ persist(); }
  render();
  SYNCING = false;

  if(silent) return;

  if(failS.length === 0 && upS.length){
    toast(`✓ Semua ${upS.length} harga + kurs diperbarui via Sheet`);
  }else if(upS.length){
    toast(`⚠ ${upS.length} ok · ${failS.length} perlu manual: ${failS.join(", ")}`);
  }else{
    toast(`✕ Auto gagal. Cek setup Apps Script, atau update manual ↓`);
  }
}

/* ===== SVG charts ===== */
function donut(items,size){
  const tot=items.reduce((s,i)=>s+i.val,0)||1, R=size/2, r=R*0.62, cx=R, cy=R; let a=-Math.PI/2, segs="";
  items.forEach(it=>{ const frac=it.val/tot, a2=a+frac*2*Math.PI;
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    const xi2=cx+r*Math.cos(a2),yi2=cy+r*Math.sin(a2),xi1=cx+r*Math.cos(a),yi1=cy+r*Math.sin(a);
    const big=frac>0.5?1:0;
    segs+=`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 ${big} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${xi2.toFixed(2)} ${yi2.toFixed(2)} A${r} ${r} 0 ${big} 0 ${xi1.toFixed(2)} ${yi1.toFixed(2)} Z" fill="${it.color}"/>`;
    a=a2; });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${segs}</svg>`;
}
function areaChart(vals,W,H){
  if(vals.length<2)return `<div class="empty" style="padding:18px">Need 2+ months of history.<br>Tap “Snapshot now” to start the trend.</div>`;
  const P=6,mn=Math.min(...vals),mx=Math.max(...vals),sp=(mx-mn)||1;
  const pts=vals.map((v,i)=>[P+i*(W-2*P)/(vals.length-1),P+(H-2*P)*(1-(v-mn)/sp)]);
  const ln=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const ar=ln+` L${pts[pts.length-1][0].toFixed(1)} ${H-P} L${pts[0][0].toFixed(1)} ${H-P} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F5C56" stop-opacity=".28"/><stop offset="1" stop-color="#1F5C56" stop-opacity="0"/></linearGradient></defs>
    <path d="${ar}" fill="url(#ag)"/><path d="${ln}" fill="none" stroke="#1F5C56" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?3.6:2.2}" fill="${i===pts.length-1?'#B5613A':'#FBF8EF'}" stroke="#1F5C56" stroke-width="1.4"/>`).join("")}
  </svg>`;
}
function barsIO(keys,W,H){
  const P=18,mx=Math.max(1,...keys.map(k=>{const c=calc(k);return Math.max(c.inT,c.outT);}));
  const gw=(W-2*P)/keys.length, bw=Math.min(15,gw*0.32);
  let b="";
  keys.forEach((k,i)=>{const c=calc(k);const x=P+i*gw+gw/2;
    const hi=(c.inT/mx)*(H-26),ho=(c.outT/mx)*(H-26);
    b+=`<rect x="${(x-bw-1).toFixed(1)}" y="${(H-22-hi).toFixed(1)}" width="${bw}" height="${hi.toFixed(1)}" rx="3" fill="#2E7D5B"/>`;
    b+=`<rect x="${(x+1).toFixed(1)}" y="${(H-22-ho).toFixed(1)}" width="${bw}" height="${ho.toFixed(1)}" rx="3" fill="#B5613A"/>`;
    b+=`<text x="${x.toFixed(1)}" y="${H-7}" font-size="10" fill="#A39C84" text-anchor="middle" font-family="Spline Sans Mono">${monthShort(k)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${b}</svg>`;
}

async function fetchRow(id){
  const h=S.holdings.find(x=>x.id===id); if(!h) return;
  const st=el(`pst-${id}`); if(st){st.textContent="…";st.style.color="var(--muted)";}
  const r=await fetchOnePrice(h);
  if(r&&r.price){
    const inp=el(`pin-${id}`); if(inp) inp.value=r.price;
    if(st){st.textContent="✓";st.style.color="var(--in)";}
  }else{
    if(st){st.textContent="✕";st.style.color="var(--neg)";}
  }
}
async function fetchAllRows(){
  toast("🔄 Mencoba semua…");
  for(const h of S.holdings){ await fetchRow(h.id); }
  const nk=await fetchKurs(); if(nk&&el("pkurs")) el("pkurs").value=nk;
  toast("Selesai — periksa lalu Simpan");
}
function savePrices(){
  S.holdings.forEach(h=>{
    const v=parseFloat(val(`pin-${h.id}`));
    if(v && !isNaN(v) && v>0) h.last=v;
  });
  const kv=parseFloat(val("pkurs"));
  if(kv && !isNaN(kv) && kv>0) S.kurs=kv;
  S.priceLog={at:new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}),kurs:`${S.kurs} (manual)`,ok:S.holdings.map(h=>`${h.ticker}→${nf(h.last)}`),fail:[]};
  persist();closeOv();render();toast("Harga tersimpan ✓");
}

  <div class="field"><label>Kategori</label><div class="chips" id="cc">${cats.map(k=>`<button class="chip ${txCat===k?'act':''}" onclick="setCat('${k}')">${k}</button>`).join("")}</div></div>
  <div class="field"><label>Tanggal</label><input id="date" type="date" value="${t?t.date:new Date().toISOString().slice(0,10)}"></div>
  <div class="acts">${t?`<button class="del" onclick="delTx('${t.id}')">Hapus</button>`:""}<button onclick="closeOv()">Batal</button><button class="save" onclick="saveTx()">Simpan</button></div>`;
  setTimeout(updTf, 50);
}

function setDir(d){
  const oldDir = txDir;
  txDir=d;
  if(d==="tf") txCat="Transfer";
  else if((d==="out"?OUT_CATS:IN_CATS).indexOf(txCat)<0) txCat=d==="out"?"Groceries":"Income";
  const t=editId?MO().tx.find(x=>x.id===editId):null;
  const a=val(oldDir==='tf'?'tfOut':'amt'),ds=val("desc"),dt=val("date");
  let ac=val("txAcc"),ac2=val("txAcc2");

  if(!t && oldDir !== d){
    if(d==='tf') {
      const y = S.accounts.find(x=>x.name==='Yuchou'); if(y) ac=y.id;
      const dm = S.accounts.find(x=>x.name==='Dompet'); if(dm) ac2=dm.id;
    } else if(d==='in') {
      const y = S.accounts.find(x=>x.name==='Yuchou'); if(y) ac=y.id;
    } else if(d==='out') {
      ac = S.lastOutAccId;
      if(!S.accounts.find(x=>x.id===ac)) {
         const dm = S.accounts.find(x=>x.name==='Dompet'); if(dm) ac=dm.id;
      }
    }
  }

  drawTx(t?Object.assign({},t,{amt:a,desc:ds,date:dt,accId:ac,accId2:ac2}):null);
  if(!t){
    if(a){ const ea=el(d==='tf'?'tfOut':'amt'); if(ea) ea.value=a; }
    if(ds)el("desc").value=ds;
    if(ac)el("txAcc").value=ac;
    if(ac2&&el("txAcc2"))el("txAcc2").value=ac2;
  }
}

function setCat(k){txCat=k;[...document.querySelectorAll("#cc .chip")].forEach(b=>b.classList.toggle("act",b.textContent===k));}
function quick(i){const q=QUICK.filter(x=>x.dir===txDir)[i];el("desc").value=q.d;setCat(q.c);if(q.a)el("amt").value=q.a;else el(txDir==='tf'?'tfOut':'amt').focus();}

function saveTx(){
  const desc=val("desc").trim(), date=val("date")||new Date().toISOString().slice(0,10);
  const accId=val("txAcc");

  if(txDir==="tf"){
    const tfOut=parseFloat(val("tfOut")), tfFee=parseFloat(val("tfFee"))||0, tfIn=parseFloat(val("tfIn"));
    const accId2=val("txAcc2");
    if(!tfOut || !tfIn){toast("Masukkan nominal");return;}
    if(accId===accId2){toast("Akun asal & tujuan sama!");return;}

    const nA=S.accounts.find(a=>a.id===accId), nB=S.accounts.find(a=>a.id===accId2);
    const baseAmt = nA && nA.ccy === "JPY" ? tfOut : tfOut / (S.kurs || 1);

    if(editId){
      const t=MO().tx.find(x=>x.id===editId);
      if(t){
        if(t.accId){const oA=S.accounts.find(a=>a.id===t.accId);if(oA)oA.amount+=(t.tfOut||t.rawAmt||t.amt)+(t.tfFee||0);}
        if(t.accId2){const oB=S.accounts.find(a=>a.id===t.accId2);if(oB)oB.amount-=(t.tfIn||t.rawAmt||t.amt);}
      }
      Object.assign(t,{amt:baseAmt, tfOut, tfFee, tfIn, desc, date, dir:txDir, cat:txCat, accId, accId2});
    } else {
      MO().tx.push({id:u(), amt:baseAmt, tfOut, tfFee, tfIn, desc, date, dir:txDir, cat:txCat, accId, accId2});
    }

    if(nA) nA.amount -= (tfOut + tfFee);
    if(nB) nB.amount += tfIn;
  } else {
    const inputAmt=parseFloat(val("amt")); if(!inputAmt||inputAmt<=0){toast("Masukkan nominal");return;}
    const nA=S.accounts.find(a=>a.id===accId);
    const baseAmt = nA && nA.ccy === "JPY" ? inputAmt : inputAmt / (S.kurs || 1);

    if(editId){
      const t=MO().tx.find(x=>x.id===editId);
      if(t && t.accId){
        const oA=S.accounts.find(a=>a.id===t.accId);
        if(oA) { const oAmt = (t.rawAmt|| (oA.ccy==="JPY"?t.amt:t.amt*(S.kurs||1))); if(t.dir==="in") oA.amount-=oAmt; else oA.amount+=oAmt; }
      }
      Object.assign(t,{amt:baseAmt, rawAmt:inputAmt, desc, date, dir:txDir, cat:txCat, accId});
    } else {
      MO().tx.push({id:u(), amt:baseAmt, rawAmt:inputAmt, desc, date, dir:txDir, cat:txCat, accId});
    }

    if(nA){ if(txDir==="in") nA.amount+=inputAmt; else nA.amount-=inputAmt; }
    if(txDir==="out") S.lastOutAccId = accId;
  }

  persist();closeOv();render();toast("Tersimpan ✓");
}

function delTx(id){
  if(!confirm("Hapus transaksi ini?"))return;
  const t=MO().tx.find(x=>x.id===id);
  if(t){
    if(t.dir==="tf"){
      if(t.accId){const a=S.accounts.find(a=>a.id===t.accId);if(a)a.amount+=(t.tfOut||t.rawAmt||t.amt)+(t.tfFee||0);}
      if(t.accId2){const a2=S.accounts.find(a=>a.id===t.accId2);if(a2)a2.amount-=(t.tfIn||t.rawAmt||t.amt);}
    } else {
      if(t.accId){
        const acc=S.accounts.find(a=>a.id===t.accId);
        if(acc){ const oAmt = (t.rawAmt|| (acc.ccy==="JPY"?t.amt:t.amt*(S.kurs||1))); if(t.dir==="in") acc.amount-=oAmt; else acc.amount+=oAmt; }
      }
    }
  }
  MO().tx=MO().tx.filter(x=>x.id!==id);
  persist();closeOv();render();
}

/* ===== holding sheet ===== */
let hEdit=null;
function openHold(id){hEdit=id||null;const h=id?S.holdings.find(x=>x.id===id):{broker:"IPOT",ticker:"",lots:0,avg:0,last:0};
  document.getElementById("sheet").innerHTML=`<div class="grip"></div>
  <div class="field"><label>Broker</label><input id="hb" value="${esc(h.broker)}"></div>
  <div class="field"><label>Ticker</label><input id="ht" value="${esc(h.ticker)}" placeholder="BRMS"></div>
  <div class="field"><label>Lots (×100 shares)</label><input id="hl" type="number" inputmode="decimal" step="any" value="${h.lots}"></div>
  <div class="field"><label>Avg buy price (Rp)</label><input id="ha" type="number" inputmode="decimal" step="any" value="${h.avg}"></div>
  <div class="field"><label>Last price (Rp)</label><input id="hp" type="number" inputmode="decimal" step="any" value="${h.last}"></div>
  <div class="acts">${id?`<button class="del" onclick="delHold('${id}')">Hapus</button>`:""}<button onclick="closeOv()">Batal</button><button class="save" onclick="saveHold()">Simpan</button></div>`;
  document.getElementById("ov").classList.add("show");}
function saveHold(){const o={broker:val("hb")||"?",ticker:(val("ht")||"?").toUpperCase(),lots:parseFloat(val("hl"))||0,avg:parseFloat(val("ha"))||0,last:parseFloat(val("hp"))||0};
  if(hEdit){Object.assign(S.holdings.find(x=>x.id===hEdit),o);}else S.holdings.push(Object.assign({id:u()},o));
  persist();closeOv();render();toast("Saved ✓");}
function delHold(id){if(!confirm("Hapus holding ini?"))return;S.holdings=S.holdings.filter(x=>x.id!==id);persist();closeOv();render();}

/* ===== misc ===== */
const el=i=>document.getElementById(i), val=i=>{const e=el(i);return e?e.value:"";};
function closeOv(){document.getElementById("ov").classList.remove("show");editId=null;hEdit=null;}
document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeOv();});
function shiftM(d){const[y,m]=S.cur.split("-").map(Number);const dt=new Date(y,m-1+d,1);S.cur=MK(dt.getFullYear(),dt.getMonth()+1);if(!S.months[S.cur])S.months[S.cur]={start:0,tx:[]};render();}
function newMonth(){const[y,m]=S.cur.split("-").map(Number);const dt=new Date(y,m,1);const k=MK(dt.getFullYear(),dt.getMonth()+1);if(!S.months[k])S.months[k]={start:calc().bal,tx:[]};S.cur=k;persist();render();toast("Bulan baru: "+monthLabel(k));}
function upAcc(id,k,v){const a=S.accounts.find(x=>x.id===id);if(!a)return;a[k]=k==="amount"?(parseFloat(v)||0):v;persist();if(k==="amount"||k==="ccy")render();}
function addAcc(){S.accounts.push({id:u(),name:"New",app:"",ccy:"JPY",amount:0});persist();render();}
function rmAcc(id){if(!confirm("Hapus akun ini?"))return;S.accounts=S.accounts.filter(x=>x.id!==id);persist();render();}
function snapNow(){const n=nw();const mth=new Date().toISOString().slice(0,7);const r={month:mth,net:Math.round(n.net),stocks:Math.round(n.stocks),cash:Math.round(n.cash),debt:Math.round(n.debt)};
  const i=S.snapshots.findIndex(s=>s.month===mth);if(i>=0)S.snapshots[i]=r;else S.snapshots.push(r);persist();render();toast("Snapshot "+mth+" ✓");}
function exportCSV(){const L=["BUKU KAS,"+new Date().toLocaleString(),"","KEKAYAAN,Name,Ccy,Amount,JPY"];
  S.accounts.forEach(a=>L.push([",",a.name,a.ccy,a.amount,Math.round(toJ(a.amount,a.ccy))].join(",")));
  L.push("","HOLDINGS,Broker,Ticker,Lots,Last(Rp),Value(Rp),Value(JPY)");
  S.holdings.forEach(h=>L.push([",",h.broker,h.ticker,h.lots,h.last,Math.round(holdVal(h)),Math.round(holdJ(h))].join(",")));
  const sv=S.cur;Object.keys(S.months).sort().forEach(k=>{S.cur=k;const c=calc(k);L.push("","MONTH,"+k,"Start,"+(MO(k).start||0),"No,Date,Desc,In,Out,Bal,Cat");
    let i=1;ord(k).forEach(t=>L.push([i++,t.date,'"'+(t.desc||"")+'"',t.dir==="in"?t.amt:"",t.dir==="out"?t.amt:"",Math.round(t._bal||0),t.cat].join(",")));
    L.push("Totals,In,"+c.inT+",Out,"+c.outT+",End,"+Math.round(c.bal));});S.cur=sv;
  dl("buku-kas.csv","text/csv",L.join("\n"));}

// Exporting JSON will now export DECRYPTED data so you have a readable backup file
function exportJSON(){dl("buku-kas-backup.json","application/json",JSON.stringify(S,null,2));}

function dl(n,t,d){const b=new Blob([d],{type:t}),url=URL.createObjectURL(b),a=document.createElement("a");a.href=url;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(url),800);toast("Downloaded "+n);}
function resetAll(){if(!confirm("Erase everything and restore your seeded situation?"))return;S=DEFAULTS();persist();render();toast("Reset");}

/* ===== APP BOOTSTRAP (Fetch -> PIN -> Decrypt -> Start) ===== */
(async function(){
  rawCipher = await STORE.get(KEY);

  const pinTitle = document.getElementById("pinTitle");
  const pinSub = document.getElementById("pinSub");
  const pinMsg = document.getElementById("pinMsg");

  // Determine if it's a completely new user, or if they have unencrypted data in the cloud
  if (!rawCipher || rawCipher === "{}" || rawCipher.length < 10) {
    isNewUser = true;
    document.getElementById("pinScreen").classList.remove("hidden");
    pinTitle.textContent = "Setup Keamanan";
    pinSub.textContent = "Buat 6-digit PIN baru untuk mengenkripsi database Anda.";
    pinMsg.textContent = "PIN ini tidak bisa di-reset. Jangan sampai lupa!";
    pinMsg.style.color = "var(--out)";
  } 
  else if (rawCipher.startsWith("{") && rawCipher.length > 20) {
    // Migration: Cloud has data, but it's not encrypted yet (from previous version)
    isNewUser = true;
    isUnencryptedMigration = true;
    try { S = JSON.parse(rawCipher); S.viewCcy = S.viewCcy || "JPY"; } catch(e) { S = DEFAULTS(); }
    
    document.getElementById("pinScreen").classList.remove("hidden");
    pinTitle.textContent = "Amankan Data";
    pinSub.textContent = "Data lama belum terenkripsi. Buat 6-digit PIN untuk menguncinya sekarang.";
    pinMsg.textContent = "PIN ini tidak bisa di-reset. Jangan sampai lupa!";
    pinMsg.style.color = "var(--out)";
  } 
  else {
    // Normal Flow: Cloud has encrypted data
    if (currentPin && currentPin.length >= 4) {
       // Auto-unlock using saved pin
       if (tryDecrypt(currentPin)) {
          return startApp();
       } else {
          currentPin = "";
          localStorage.removeItem("app_key");
       }
    }
    // Show Unlock Screen
    document.getElementById("pinScreen").classList.remove("hidden");
  }
})();
</script>
